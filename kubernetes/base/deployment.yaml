apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-ai-platform
  labels:
    app: chatbot-ai-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: chatbot-ai-platform
  template:
    metadata:
      labels:
        app: chatbot-ai-platform
    spec:
      containers:
        - name: chatbot-web
          image: chatbot-ai-platform:v2.1
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: chatbot-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            limits:
              cpu: "1000m"
              memory: "1024Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot-ai-service
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app: chatbot-ai-platform
