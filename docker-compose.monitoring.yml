# Observability stack: Prometheus scrapes the app's /api/metrics endpoint and
# Grafana visualises it, both provisioned from files so the stack comes up
# ready rather than needing manual UI setup.
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.monitoring.yml up -d
#
# Grafana: http://localhost:3001  ·  Prometheus: http://localhost:9090
#
# Kept separate from docker-compose.prod.yml so the application stack can run
# without it — on Vercel or another managed host the app is scraped by that
# platform's own tooling instead, and this file simply isn't used.

services:
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      # Anonymous access is off and the admin password must be supplied —
      # defaulting to admin/admin on a port-mapped container is how monitoring
      # stacks end up publicly readable.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
