groups:
  - name: chatbot_alerts
    rules:
      - alert: HighVoiceWebhookLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job="vapi_webhook"}[5m])) by (le)) > 0.85
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High Vapi Voice Webhook Latency (> 850ms)"

      - alert: DatabaseConnectionPoolHigh
        expr: supabase_active_connections / supabase_max_connections > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Supabase active connections exceed 85% capacity"
